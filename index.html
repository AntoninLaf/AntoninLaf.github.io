<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antonin Laferrière-Mailfait</title>
  <meta name="description" content="I frame the right problems, test the critical assumptions, and turn insight into measurable business value. A field notebook of the products and ventures I've worked on: GLRlight, Acteurly, VersyTalks, VersyNow.">
  <meta property="og:title" content="Antonin Laferrière-Mailfait">
  <meta property="og:description" content="I frame the right problems, test the critical assumptions, and turn insight into measurable business value.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/kalam-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/ink.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0 0.06 0.08"/></feComponentTransfer>
    </filter>
    <filter id="ink-bleed" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9"/>
    </filter>
  </svg>

  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="back" href="#/" id="back-link" hidden></a>
    <div class="topbar-right">
      <button class="lang" id="lang-toggle" type="button" aria-label="Switch language"></button>
    </div>
  </header>

  <main id="sheet-host"></main>

  <div class="quill-wrap" id="quill-wrap">
    <span class="quill-callout" id="quill-callout" hidden></span>
    <button class="quill" id="ask-tab" type="button">
      <svg class="quill-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path class="vane" d="M40 6 C31 7 19 17 14 34 C23 33 33 24 40 6 Z"/>
        <path class="spine" d="M40 6 C30 14 20 26 11 42"/>
        <path class="barb" d="M24 22 C27 21 30 21 33 22 M19 29 C23 27 27 27 31 27 M28 16 C31 15 34 15 37 16"/>
        <path class="nib" d="M11 42 L8 45"/>
      </svg>
      <span class="quill-label" data-i18n="ask.tab"></span>
    </button>
  </div>
  <div class="ask-veil" id="ask-veil" hidden></div>
  <aside class="ask-panel" id="ask-panel" aria-hidden="true" role="dialog" aria-labelledby="ask-title">
    <div class="ask-head">
      <svg class="ask-head-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path class="vane" d="M40 6 C31 7 19 17 14 34 C23 33 33 24 40 6 Z"/>
        <path class="spine" d="M40 6 C30 14 20 26 11 42"/>
      </svg>
      <span class="ask-title" id="ask-title" data-i18n="ask.title"></span>
      <button class="ask-close" id="ask-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="ask-body" id="ask-body"></div>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
