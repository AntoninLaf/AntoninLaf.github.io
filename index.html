<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antonin Laferrière-Mailfait</title>
  <meta name="description" content="I turn messy business questions into products and decisions that ship. A field notebook of the problems I've worked on: supplier risk in London, marketing analytics for Québec shops, a debate platform grown from 40 to 10,000, an event-analytics agent that never invents a number.">
  <meta property="og:title" content="Antonin Laferrière-Mailfait">
  <meta property="og:description" content="I turn messy business questions into products and decisions that ship.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/kalam-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/ink.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0 0.06 0.08"/></feComponentTransfer>
    </filter>
    <filter id="ink-bleed" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9"/>
    </filter>
  </svg>

  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="back" href="#/" id="back-link" hidden></a>
    <div class="topbar-right">
      <button class="lang" id="lang-toggle" type="button" aria-label="Switch language"></button>
    </div>
  </header>

  <main id="sheet-host"></main>

  <button class="ask-tab" id="ask-tab" type="button"></button>
  <aside class="ask-panel" id="ask-panel" aria-hidden="true">
    <div class="ask-head">
      <span class="ask-title" data-i18n="ask.title"></span>
      <button class="ask-close" id="ask-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="ask-body" id="ask-body"></div>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
